# Weekly update pull requests: npm packages (minor and patch updates grouped
# into one pull request; each major update gets its own) and the CI actions,
# which are pinned by SHA.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
