name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Package install scripts stay off, as on the development machine.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and component tests
        run: npm run test

      # Hard rules from CLAUDE.md: no source-site captures, no source name
      # outside the files allowed to carry it.
      - name: Asset check
        run: npm run check:assets

      - name: Audit shipped dependencies
        run: npm audit --omit=dev

      - name: Build
        run: npm run build
