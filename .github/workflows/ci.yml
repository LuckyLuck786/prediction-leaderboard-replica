name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Package install scripts stay off, as on the development machine.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # Fails when coverage falls under the thresholds in vitest.config.mts.
      - name: Unit and component tests, with coverage
        run: npm run test:coverage

      # Hard rules from CLAUDE.md: no source-site captures, no source name
      # outside the files allowed to carry it.
      - name: Asset check
        run: npm run check:assets

      - name: Audit shipped dependencies
        run: npm audit --omit=dev

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The runner has no browser; this installs the Chromium build that the
      # pinned Playwright version expects, with its system libraries.
      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      # Builds the app against the local fixture server and runs every
      # end-to-end test offline, at desktop and phone sizes.
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Keep the report when a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
